<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintCost 3D - Gestão & Calculadora</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase App & Services (v13.2.0 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- BARRA SUPERIOR / HEADER -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="bg-cyan-500 text-slate-900 p-2 rounded-lg font-bold">
          <i class="fa-solid fa-cube"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-cyan-400 leading-tight">PrintCost 3D</h1>
          <p class="text-xs text-slate-400">Calculadora & Gestão</p>
        </div>
      </div>
      <div id="user-profile" class="hidden flex items-center gap-2">
        <span id="user-display-name" class="text-xs text-slate-300 font-medium truncate max-w-[100px]"></span>
        <button id="logout-btn" class="text-xs bg-red-500/20 text-red-400 border border-red-500/30 px-2 py-1 rounded hover:bg-red-500/30">
          Sair
        </button>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-6">

    <!-- TELA DE AUTENTICAÇÃO -->
    <div id="auth-card" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-5">
      <div class="text-center space-y-1">
        <h2 class="text-2xl font-bold text-white">Acessar Conta</h2>
        <p class="text-xs text-slate-400">Sincronize os seus dados em nuvem no celular e PC</p>
      </div>

      <!-- BOTÃO GOOGLE -->
      <button id="google-btn" class="w-full bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white font-medium py-3 rounded-xl flex items-center justify-center gap-3 transition-colors">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Entrar com Google
      </button>

      <div class="flex items-center gap-2 text-xs text-slate-500 uppercase font-semibold">
        <div class="flex-1 h-px bg-slate-700"></div>
        ou com e-mail
        <div class="flex-1 h-px bg-slate-700"></div>
      </div>

      <!-- FORMULÁRIO DE EMAIL / SENHA -->
      <form id="email-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">E-mail</label>
          <input type="email" id="auth-email" placeholder="seu@email.com" required
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Senha</label>
          <input type="password" id="auth-password" placeholder="••••••••" required minlength="6"
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500">
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2">
          <button type="submit" id="login-btn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition-colors">
            Entrar
          </button>
          <button type="button" id="register-btn" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl text-sm transition-colors">
            Criar Conta
          </button>
        </div>
      </form>

      <div id="auth-error" class="hidden p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-xs text-red-400 text-center"></div>
    </div>

    <!-- TELA PRINCIPAL (APÓS LOGIN) -->
    <div id="app-dashboard" class="hidden space-y-6">
      
      <!-- CALCULADORA RÁPIDA -->
      <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
        <h3 class="font-bold text-white flex items-center gap-2 text-sm">
          <i class="fa-solid fa-calculator text-cyan-400"></i> Calculadora de Impressão 3D
        </h3>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Peso da Peça (g)</label>
            <input type="number" id="calc-weight" placeholder="100" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Preço do Rolo (R$)</label>
            <input type="number" id="calc-spool-price" placeholder="120" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Tempo (Horas)</label>
            <input type="number" id="calc-hours" placeholder="5" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Potência (Watts)</label>
            <input type="number" id="calc-power" value="150" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white">
          </div>
        </div>

        <button id="calculate-btn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition-colors">
          Calcular Custo Final
        </button>

        <div id="calc-result" class="hidden bg-slate-900/80 border border-cyan-500/30 p-4 rounded-xl text-center space-y-1">
          <p class="text-xs text-slate-400">Custo Total de Produção</p>
          <p id="total-cost" class="text-2xl font-black text-cyan-400">R$ 0,00</p>
        </div>
      </div>

    </div>
  </main>

  <!-- LÓGICA JAVASCRIPT & FIREBASE -->
  <script>
    // 1. CONFIGURAÇÃO DO FIREBASE (Projeto calculadora3d-f5b41)
    const firebaseConfig = {
      apiKey: "AIzaSyCtkQEQJk_Y7W-evRpY9xhwx2w9z9fafBQ",
      authDomain: "calculadora3d-f5b41.firebaseapp.com",
      projectId: "calculadora3d-f5b41",
      storageBucket: "calculadora3d-f5b41.firebasestorage.app",
      messagingSenderId: "490821992035",
      appId: "1:490821992035:web:39ed89a04b8df33a378256"
    };

    // Inicializar Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ELEMENTOS DO DOM
    const authCard = document.getElementById('auth-card');
    const appDashboard = document.getElementById('app-dashboard');
    const userProfile = document.getElementById('user-profile');
    const userDisplayName = document.getElementById('user-display-name');
    const authError = document.getElementById('auth-error');

    const googleBtn = document.getElementById('google-btn');
    const emailForm = document.getElementById('email-form');
    const registerBtn = document.getElementById('register-btn');
    const logoutBtn = document.getElementById('logout-btn');

    // EXIBIR ERRO
    function showError(msg) {
      authError.textContent = msg;
      authError.classList.remove('hidden');
    }

    function clearError() {
      authError.textContent = '';
      authError.classList.add('hidden');
    }

    // 2. OBSERVADOR DE ESTADO DE AUTENTICAÇÃO
    auth.onAuthStateChanged((user) => {
      if (user) {
        // Usuário Logado
        authCard.classList.add('hidden');
        appDashboard.classList.remove('hidden');
        userProfile.classList.remove('hidden');
        userDisplayName.textContent = user.displayName || user.email.split('@')[0];
        clearError();
      } else {
        // Usuário Deslogado
        authCard.classList.remove('hidden');
        appDashboard.classList.add('hidden');
        userProfile.classList.add('hidden');
      }
    });

    // 3. LOGIN COM GOOGLE
    googleBtn.addEventListener('click', async () => {
      clearError();
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        // Tenta abrir janela popup
        await auth.signInWithPopup(provider);
      } catch (err) {
        console.warn('Popup bloqueado, tentando redirecionamento:', err);
        try {
          // Se popup for bloqueado em celulares, faz por redirect
          await auth.signInWithRedirect(provider);
        } catch (redirectErr) {
          showError('Falha ao entrar com Google: ' + redirectErr.message);
        }
      }
    });

    // 4. LOGIN COM E-MAIL E SENHA
    emailForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        showError('Erro ao entrar: ' + err.message);
      }
    });

    // 5. CADASTRO DE NOVO USUÁRIO
    registerBtn.addEventListener('click', async () => {
      clearError();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      if (!email || !password) {
        showError('Preencha o e-mail e a senha para criar uma conta.');
        return;
      }

      try {
        await auth.createUserWithEmailAndPassword(email, password);
      } catch (err) {
        showError('Erro ao criar conta: ' + err.message);
      }
    });

    // 6. LOGOUT (SAIR)
    logoutBtn.addEventListener('click', () => {
      auth.signOut();
    });

    // 7. CÁLCULO RÁPIDO DE CUSTO
    document.getElementById('calculate-btn').addEventListener('click', () => {
      const weight = parseFloat(document.getElementById('calc-weight').value) || 0;
      const price = parseFloat(document.getElementById('calc-spool-price').value) || 0;
      const hours = parseFloat(document.getElementById('calc-hours').value) || 0;
      const watts = parseFloat(document.getElementById('calc-power').value) || 150;

      // Custo de filamento: (preço do rolo / 1000g) * peso da peça
      const filamentCost = (price / 1000) * weight;

      // Custo de energia (Média R$ 0,85 por kWh)
      const kwh = (watts * hours) / 1000;
      const energyCost = kwh * 0.85;

      const total = filamentCost + energyCost;

      document.getElementById('total-cost').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
      document.getElementById('calc-result').classList.remove('hidden');
    });
  </script>
</body>
</html>
